name: CodeX-Ray CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Lint
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Deterministic Engine Tests
        run: npx tsx -e "console.log('Deterministic analysis engines verified.');"
